# Blackgate Debian 13 unattended appliance installer.
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string blackgate
d-i netcfg/get_domain string local

# No archive mirror. Base system and all Blackgate packages come from ISO.
d-i apt-setup/use_mirror boolean false
d-i apt-setup/cdrom/set-first boolean true
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none
d-i popularity-contest/participate boolean false

# First non-removable disk. USB installer media is normally removable.
d-i preseed/early_command string \
  disk="$(list-devices disk | while read -r d; do n=${d##*/}; if [ "$(cat "/sys/block/$n/removable" 2>/dev/null)" = 0 ]; then printf '%s\\n' "$d"; break; fi; done)"; \
  if [ -n "$disk" ]; then debconf-set partman-auto/disk "$disk"; fi; \
  true
d-i partman-auto/method string lvm
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Appliance account. Change credentials after deployment.
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password $6$BGdev2025salt$JSPuWJdO5tqqc8Nv9IrKJZdX24RgSe9tn4hJZzkmfT81j4umd8/xZbYI1.r9F661HjS.YhwycOXtMsHijBtCP/
d-i passwd/user-fullname string Blackgate
d-i passwd/username string blackgate
d-i passwd/user-password-crypted password $6$DW0zy6128MQOaqTY$NEOd3yZuWNEnNy63QbvqPio9GMpBx9NHWOnBAyUIjhrawA933b57WmeAgKy2qCXzAwAYDCKLGXNE67Oj2SFVj/
d-i passwd/user-default-groups string audio video

d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i base-installer/install-recommends boolean false
d-i tasksel/first multiselect standard, ssh-server
d-i finish-install/reboot_in_progress note

d-i preseed/late_command string \
  mkdir -p /target/opt/blackgate /target/var/lib/blackgate/khepri /target/etc/apt/blackgate-empty-sources.list.d /target/etc/systemd/system/multi-user.target.wants /target/etc/profile.d; \
  cp /cdrom/blackgate/blackgate-release.tar.gz /target/opt/blackgate/; \
  cp /cdrom/blackgate/desktopvideo_16.0.1a2_amd64.deb /target/opt/blackgate/; \
  cp /cdrom/blackgate/decklink-profile-config /target/opt/blackgate/; \
  cp /cdrom/blackgate/blackgate-firstboot.sh /target/opt/blackgate/; \
  cp /cdrom/blackgate/99-blackgate-login-info.sh /target/etc/profile.d/blackgate-info.sh; \
  cp /cdrom/blackgate/blackgate.service /target/etc/systemd/system/; \
  cp /cdrom/blackgate/blackgate-firstboot.service /target/etc/systemd/system/; \
  cp -a /cdrom/blackgate/offline-repo /target/opt/blackgate/; \
  printf '%s\n' 'deb [trusted=yes] file:/opt/blackgate/offline-repo ./' > /target/etc/apt/sources.list.d/blackgate-offline.list; \
  in-target apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/blackgate-offline.list -o Dir::Etc::sourceparts=/etc/apt/blackgate-empty-sources.list.d update; \
  in-target apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/blackgate-offline.list -o Dir::Etc::sourceparts=/etc/apt/blackgate-empty-sources.list.d --no-install-recommends -y install build-essential dkms kmod linux-image-amd64 linux-headers-amd64 openssh-server gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav libcjson1 libgl1 libsrt1.5-gnutls net-tools /opt/blackgate/desktopvideo_16.0.1a2_amd64.deb; \
  chmod +x /target/opt/blackgate/blackgate-firstboot.sh /target/opt/blackgate/decklink-profile-config /target/etc/profile.d/blackgate-info.sh; \
  chown -R 1000:1000 /target/opt/blackgate /target/var/lib/blackgate; \
  ln -sf /etc/systemd/system/blackgate-firstboot.service /target/etc/systemd/system/multi-user.target.wants/blackgate-firstboot.service
