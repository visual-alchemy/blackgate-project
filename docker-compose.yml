services:
  blackgate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host # Use host networking for direct access to all network interfaces
    # Note: With network_mode: host, ports are exposed directly on the host
    # No port mapping needed - container uses host ports directly
    environment:
      - NODE_IP=127.0.0.1
      - RELEASE_COOKIE="Vt8gXnEI2zRH4l3eqUEBrcGQ22mHSj73CgkYm02u"
      - PHX_SERVER=true
      - PORT=4000
      - PHX_HOST=0.0.0.0
      - API_AUTH_USERNAME=admin
      - API_AUTH_PASSWORD=password123
      - DATABASE_DATA_DIR=/app/khepri
      - LICENSE_SERVER_URL=https://license-server-eta-bay.vercel.app
      - RLIMIT_NOFILE=65536
    volumes:
      - ./data/khepri:/app/khepri
      - ./data/backup:/app/backup
    # =========================================================================
    # Hardware Device Passthrough (uncomment as needed)
    # =========================================================================
    # DeckLink Quad 2: 8 SDI I/O channels (requires host driver: desktopvideo)
    # Intel GPU: VA-API hardware decoding (for SDI output decode pipeline)
    devices:
      - /dev/blackmagic/io0:/dev/blackmagic/io0
      - /dev/blackmagic/io1:/dev/blackmagic/io1
      - /dev/blackmagic/io2:/dev/blackmagic/io2
      - /dev/blackmagic/io3:/dev/blackmagic/io3
      - /dev/blackmagic/io4:/dev/blackmagic/io4
      - /dev/blackmagic/io5:/dev/blackmagic/io5
      - /dev/blackmagic/io6:/dev/blackmagic/io6
      - /dev/blackmagic/io7:/dev/blackmagic/io7
      - /dev/dri:/dev/dri
