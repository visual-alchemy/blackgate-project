[workspace]
members = ["blackgate-engine", "engine-config", "engine-gst", "engine-failover", "engine-sdi", "engine-metadata", "engine-stats", "engine-thumbnail"]
default-members = ["blackgate-engine"]
resolver = "2"
# Migration-era binaries (spikes and the stats-socket shadow client) live under tools/ and
# are deliberately not members: nothing depends on them, so they must not be built by every
# `make -C native`, `cargo test`, Clippy run and benchmark image build.
exclude = ["tools"]
