name: Build Blackgate ISO

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build-iso:
    name: Build Ubuntu 24.04 LTS ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Set up BEAM toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: 27.0.1
          elixir-version: 1.18.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: web_app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"

      - name: Install ISO and runtime build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            dosfstools \
            fdisk \
            git \
            libcjson-dev \
            libglib2.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer1.0-dev \
            libsrt-gnutls-dev \
            meson \
            ninja-build \
            pkg-config \
            xorriso

      - name: Download Ubuntu 24.04.4 LTS source ISO
        run: |
          curl --fail --location --retry 5 \
            --output iso-builder/ubuntu-24.04.4-live-server-amd64.iso \
            https://releases.ubuntu.com/24.04.4/ubuntu-24.04.4-live-server-amd64.iso

      - name: Build bare-metal Blackgate ISO
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x iso-builder/build.sh
          ./iso-builder/build.sh

      - name: Name versioned ISO
        run: |
          mv iso-builder/output/blackgate-installer-amd64.iso \
            "iso-builder/output/blackgate-${{ steps.version.outputs.version }}-amd64.iso"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: blackgate-${{ steps.version.outputs.version }}-amd64
          path: iso-builder/output/*.iso
          retention-days: 30

  release-iso:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [build-iso]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.iso
          generate_release_notes: true
          body: |
            ## Blackgate Server ISO Appliance ${{ github.ref_name }}

            Bare-metal **Ubuntu 24.04 LTS (Noble)** appliance. Blackgate ships as
            an OTP release with bundled ERTS and Rust-only media engine. Docker is
            not required on installed gateways.

            ### Installation

            1. Download `blackgate-*-amd64.iso`.
            2. Flash to USB or mount in a VM.
            3. Boot and follow automated Ubuntu installer.
            4. Open `http://<server-ip>:4000`.

            ### Default credentials

            - Dashboard: `admin` / `password123`
            - SSH: `blackgate` / `blackgate123`

            Change default passwords after first login.
